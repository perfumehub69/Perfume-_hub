<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfume Hub</title>
<style>
body{margin:0;font-family:Arial;background:#000;color:#fff}
header{background:linear-gradient(#d4af37,#000);padding:35px;text-align:center}
h1{margin:0;color:#fff;font-size:38px}
.box{padding:20px}
input,button{width:100%;padding:14px;margin-top:10px;border-radius:12px;border:none}
input{background:#222;color:#fff}
button{background:#d4af37;color:#000;font-weight:bold}
.card{background:#111;padding:15px;border-radius:15px;margin-top:15px}
img{width:90px;height:90px;border-radius:50%;display:none;margin:15px auto}
#home{display:none}
</style>
</head>
<body>

<header>
<h1>PERFUME HUB</h1>
<p>Luxury • Original • Imported Perfumes</p>
</header>

<div class="box" id="login">
<h2>Continue with Google</h2>
<input id="email" type="email" placeholder="Enter Gmail">
<button onclick="login()">Login</button>
</div>

<div class="box" id="home">
<h2>Welcome</h2>
<p id="user"></p>

<img id="pfp">
<input type="file" id="gallery" accept="image/*">
<p>Set your profile picture</p>

<div class="card">
<h3>Dior Sauvage</h3>
<p>৳4,500</p>
</div>

<div class="card">
<h3>Lattafa Asad</h3>
<p>৳2,300</p>
</div>

<div class="card">
<h3>Versace Eros</h3>
<p>৳5,200</p>
</div>
</div>

<script>
function login(){
 let email=document.getElementById("email").value;
 if(email==""){alert("Enter Gmail");return;}
 document.getElementById("login").style.display="none";
 document.getElementById("home").style.display="block";
 document.getElementById("user").innerHTML=email;
}
gallery.onchange=function(e){
 let file=e.target.files[0];
 let reader=new FileReader();
 reader.onload=function(){
  pfp.src=reader.result;
  pfp.style.display="block";
 }
 reader.readAsDataURL(file);
}
</script>

</body>
</html>
