<!DOCTYPE html>
<html>
<head>
  <title>Perfume Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{margin:0;font-family:Arial;background:#000;color:#fff}
    .top{background:linear-gradient(#D4AF37,#000);padding:30px;text-align:center}
    h1{margin:0;font-size:36px}
    .box{padding:20px;max-width:350px;margin:auto}
    input,button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:12px}
    input{background:#222;color:#fff}
    button{background:#D4AF37;color:#000;font-weight:bold}
    #home{display:none}
    #pfp{width:110px;height:110px;border-radius:50%;display:none;margin:15px auto}
    .card{background:#111;padding:15px;border-radius:15px;margin-top:15px}
  </style>
</head>
<body>

<div class="top">
  <h1>PERFUME HUB</h1>
  <p>Luxury • Original • Imported Perfumes</p>
</div>

<div class="box" id="loginPage">
  <h2>Continue with Google</h2>
  <input id="gmail" type="email" placeholder="Enter your Gmail">
  <button onclick="login()">LOGIN</button>
</div>

<div class="box" id="home">
  <h2>Welcome</h2>
  <p id="emailText"></p>

  <img id="pfp">
  <input id="file" type="file" accept="image/*">

  <div class="card">
    <b>Dior Sauvage</b><br>৳4,500
  </div>

  <div class="card">
    <b>Lattafa Asad</b><br>৳2,300
  </div>

  <div class="card">
    <b>Versace Eros</b><br>৳5,200
  </div>
</div>

<script>
function login(){
  let email=document.getElementById("gmail").value;
  if(email==""){alert("Enter Gmail");return;}
  loginPage.style.display="none";
  home.style.display="block";
  emailText.innerHTML=email;
}

file.onchange=function(e){
  let reader=new FileReader();
  reader.onload=function(){
    pfp.src=reader.result;
    pfp.style.display="block";
  }
  reader.readAsDataURL(e.target.files[0]);
}
</script>

</body>
</html>
